# Kit agences : Postgres + API + front (jeu d’essai, sans GeoServer).
# Usage : docker compose up --build
# App : http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portrait_communes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/sample/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/sql/sample/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portrait_communes"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PGHOST: postgres
      PGDATABASE: portrait_communes
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: changeme
      PGSCHEMA: portrait_sample
      COMMUNES_GEOJSON_PATH: /app/data/sample-communes.geojson
      PORT: "5000"
      HOST: 0.0.0.0
      NODE_ENV: production
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TRUST_PROXY: "1"
      API_RATE_LIMIT_MAX: "1000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_SAMPLE_TERRITORY: "true"
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
